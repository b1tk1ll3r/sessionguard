services:
  sessionguard-master:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./master.json:/etc/sessionguard/master.json:ro
      - sessionguard-data:/var/lib/sessionguard

volumes:
  sessionguard-data:
